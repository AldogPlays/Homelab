services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    user: "999:999"
    group_add:
      - "568"
    env_file:
      - path: /mnt/tank/appdata/joplin/postgres.env
        format: raw
    volumes:
      - /mnt/tank/appdata/joplin/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  joplin:
    image: joplin/server:amd64-3.7.3
    restart: unless-stopped
    user: "1001:1001"
    group_add:
      - "568"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: /mnt/tank/appdata/joplin/joplin.env
        format: raw
    ports:
      - "30106:30106"