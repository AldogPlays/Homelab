services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    user: "999:999"
    group_add:
      - "568"
    env_file:
      - path: /mnt/tank/appdata/lubelogger/postgres.env
        format: raw
    volumes:
      - /mnt/tank/appdata/lubelogger/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  lubelogger:
    image: ghcr.io/hargata/lubelogger:v1.7.4
    restart: unless-stopped
    user: "568:568"
    group_add:
      - "568"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: /mnt/tank/appdata/lubelogger/lubelogger.env
        format: raw
    ports:
      - "30035:30035"
    volumes:
      - /mnt/tank/appdata/lubelogger/data:/App/data
      - /mnt/tank/appdata/lubelogger/keys:/root/.aspnet/DataProtection-Keys