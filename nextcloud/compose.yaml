# Deploy only after the final HTML/data synchronization and PostgreSQL cutover.
x-nextcloud-image: &nextcloud-image
  image: homelab-nextcloud:35.0.2-ffmpeg
  build:
    context: .
    dockerfile: Dockerfile
  pull_policy: build

services:
  nextcloud:
    <<: *nextcloud-image
    restart: unless-stopped
    env_file:
      - /mnt/tank/appdata/nextcloud/secrets/nextcloud.env
    ports:
      - "30027:80"
    volumes: &nextcloud-volumes
      - type: bind
        source: /mnt/tank/appdata/nextcloud/html
        target: /var/www/html
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/tank/data/files
        target: /var/www/html/data
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -d
        - default_socket_timeout=5
        - -r
        - >-
          $$status = json_decode(file_get_contents('http://127.0.0.1/status.php'), true);
          exit(is_array($$status) && ($$status['installed'] ?? false)
          && !($$status['needsDbUpgrade'] ?? true) ? 0 : 1);
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  cron:
    <<: *nextcloud-image
    restart: unless-stopped
    entrypoint: /cron.sh
    env_file:
      - /mnt/tank/appdata/nextcloud/secrets/cron.env
    volumes: *nextcloud-volumes
    depends_on:
      nextcloud:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Checks the scheduler process; successful job execution must be verified separately.
      test: ["CMD-SHELL", "grep -q crond /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    user: "999:999"
    restart: unless-stopped
    env_file:
      - /mnt/tank/appdata/nextcloud/secrets/postgres.env
    environment:
      PGDATA: /var/lib/postgresql/17/docker
    volumes:
      - type: bind
        source: /mnt/tank/appdata/nextcloud/postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: ghcr.io/valkey-io/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    user: "568:568"
    restart: unless-stopped
    env_file:
      - /mnt/tank/appdata/nextcloud/secrets/redis.env
    command:
      - sh
      - -ec
      - 'exec valkey-server --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD must be set and nonempty}"'
    volumes:
      - type: bind
        source: /mnt/tank/appdata/nextcloud/redis
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$${REDIS_PASSWORD:?REDIS_PASSWORD must be set and nonempty}\" valkey-cli --raw ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
