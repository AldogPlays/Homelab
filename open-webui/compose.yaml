services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.0
    restart: unless-stopped

    ports:
      - "10.10.10.10:30070:8080"

    env_file:
      - /mnt/tank/appdata/open-webui/secrets/open-webui.env

    environment:
      WEBUI_URL: "https://open-webui.home.arpa"
      ENABLE_OLLAMA_API: "False"

    volumes:
      - type: bind
        source: /mnt/tank/appdata/open-webui/data
        target: /app/backend/data
        bind:
          create_host_path: false